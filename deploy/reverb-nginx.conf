# Forward Laravel Reverb browser sockets to the local process.
# PHP publishes events to 127.0.0.1:6001 itself, so only /app is proxied.
# Leave port 6001 off the public firewall.
#
# Herd HTTPS: paste this location into the site nginx config for public.test.
# Plain http://public.test does not need it; the browser uses port 6001 directly.
#
# Ubuntu: include this file from the site's server { } block, then reload nginx.

location /app {
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Scheme $scheme;
    proxy_set_header SERVER_PORT $server_port;
    proxy_set_header REMOTE_ADDR $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_read_timeout 60s;

    proxy_pass http://127.0.0.1:6001;
}
